name: Build Windows bundle

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Byte-compile
        run: python -m compileall -q app scripts

      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm DesyncPilot.spec

      - name: Zip bundle
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag) { $tag = "dev-$(Get-Date -Format yyyyMMdd-HHmm)" }
          Compress-Archive -Path dist/DesyncPilot/* -DestinationPath "DesyncPilot-$tag.zip"
          Get-FileHash "DesyncPilot-$tag.zip" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  DesyncPilot-$tag.zip" } |
            Set-Content "DesyncPilot-$tag.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DesyncPilot
          path: |
            DesyncPilot-*.zip
            DesyncPilot-*.zip.sha256

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            DesyncPilot-*.zip
            DesyncPilot-*.zip.sha256
          generate_release_notes: true
